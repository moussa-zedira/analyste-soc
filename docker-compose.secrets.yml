# Overlay : utilise Docker secrets au lieu de variables d'environnement clair.
#
# Pre-requis :
#   1. Genere les secrets : make secrets-init  (cree ./secrets/*.txt avec 0600)
#   2. Lance le stack    : docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Les secrets sont montes par Docker dans /run/secrets/<nom>. Le code Python
# (apps/api/config.py:_load_file_backed_secrets) lit VAR_FILE puis expose VAR.

version: "3.9"

secrets:
  api_key:
    file: ./secrets/api_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  api:
    environment:
      API_KEY_FILE: /run/secrets/api_key
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - api_key
      - jwt_secret

  worker:
    environment:
      API_KEY_FILE: /run/secrets/api_key
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - api_key
      - jwt_secret

  beat:
    environment:
      API_KEY_FILE: /run/secrets/api_key
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - api_key
      - jwt_secret

  syslog:
    environment:
      API_KEY_FILE: /run/secrets/api_key
    secrets:
      - api_key

  web:
    # Next.js lit INTERNAL_API_KEY au demarrage : on l'injecte depuis le secret monte.
    entrypoint:
      - sh
      - -c
      - 'export INTERNAL_API_KEY="$(cat /run/secrets/api_key)" && exec node server.js'
    secrets:
      - api_key
