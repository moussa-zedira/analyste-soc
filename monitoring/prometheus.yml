global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: cyberdef-soc

scrape_configs:
  - job_name: cyberdef-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          env: dev

  # Optionnel : metriques Postgres via postgres_exporter (active si profile monitoring-extra)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Optionnel : metriques Redis via redis_exporter
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
