worker_processes  auto;
events { worker_connections  1024; }

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Limites de base contre l'abus.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # ── HTTP : redirige tout vers HTTPS ────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS : termine TLS, route vers api/web ────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (1 an, opt-in) — a activer apres validation des certs
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # En-tetes durcis
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── API ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            # Auth flow : limite plus stricte
            location ~ ^/api/(auth/login|auth/register) {
                limit_req zone=login_limit burst=10 nodelay;
                proxy_pass http://api:8000;
            }
            proxy_pass http://api:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Backend direct (passe-plat) ─────────────────────
        location ~ ^/(health|livez|readyz|metrics|docs|openapi.json|auth/|events/|incidents/|stats/|detection/|alerts/|admin/|sigma/|soar/|pentest/|recon/|chat|cql|ml/|threat-intel/|threat-scores/|investigate/|triage/|export/) {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Frontend Next.js ────────────────────────────────
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
