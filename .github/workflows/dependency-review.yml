name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nécessite le Dependency graph activé sur le repo (fait via l'activation
      # des vulnerability-alerts). S'il était désactivé, ce step échoue avec
      # "Dependency review is not supported on this repository".
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        # CVE-2025-69872 : diskcache 5.6.3 (transitive via sliver-py), aucun
        # correctif publié en amont. Exclusion ciblée — échoue sur toute autre CVE.
        run: pip-audit -r apps/api/requirements.txt --strict --ignore-vuln CVE-2025-69872

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: NPM audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true
