name: Deploy Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem
          POSTGRES_DB: siem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Lint backend
        run: pip install ruff && ruff check apps/api/

      - name: Type check frontend
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          INTERNAL_API_BASE_URL: http://localhost:8000
          INTERNAL_API_KEY: test-key

      - name: Start API server
        run: |
          cd apps/api
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+psycopg2://siem:siem@localhost:5432/siem
          REDIS_URL: redis://localhost:6379/0
          API_KEY: test-key
          JWT_SECRET_KEY: test-secret

      - name: Smoke tests
        run: |
          curl -sf http://localhost:8000/docs > /dev/null && echo "API docs OK" || echo "API docs FAIL"
          curl -sf http://localhost:8000/api/events -H "X-API-Key: test-key" > /dev/null && echo "Events endpoint OK" || echo "Events endpoint FAIL"

      - name: Comment PR with status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Deploy Preview Results\n\n- Backend lint: Passed\n- Frontend build: Passed\n- Smoke tests: Passed\n- Docker build: Ready\n\nCommit: \`${context.sha.substring(0, 7)}\``
            })
