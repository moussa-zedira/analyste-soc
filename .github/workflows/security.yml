name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # CodeQL : analyse statique Python + JS
  # ─────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────────────────
  # Trivy : scan filesystem (deps Python + JS) + scan images
  # ─────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy FS (deps + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-images:
    name: Trivy Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: cyberdef-api:scan
          cache-from: type=gha

      - name: Build Web image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: cyberdef-web:scan
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          cache-from: type=gha

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberdef-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberdef-web:scan
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload API scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload Web scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

  # ─────────────────────────────────────────────────────────
  # pip-audit : CVE des dependances Python
  # ─────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit
        run: pip-audit -r apps/api/requirements.txt --strict || true
        # ``|| true`` : informatif tant qu'on n'a pas trie les CVE legacy.

  # ─────────────────────────────────────────────────────────
  # npm audit : CVE des dependances JS
  # ─────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit (JS deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────────
  # TruffleHog : detection de secrets dans l'historique
  # ─────────────────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
