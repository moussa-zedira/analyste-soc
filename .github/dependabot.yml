version: 2

updates:
  # Backend Python
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "black", "isort", "testcontainers*", "fakeredis"]
      dev:
        patterns: ["pytest*", "ruff", "mypy", "black", "isort", "testcontainers*", "fakeredis"]

  # Frontend JS
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      next-stack:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      tooling:
        patterns: ["eslint*", "prettier", "typescript", "@types/node"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]

  # Docker base images
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    labels: [dependencies, docker]
