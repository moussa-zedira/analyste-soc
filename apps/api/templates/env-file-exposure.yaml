id: env-file-exposure
info:
  name: ".env File Exposure"
  severity: high
  description: "Detection de l'exposition du fichier .env contenant des variables d'environnement sensibles."
  tags: exposure,env,config,high,credentials

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.backup"
    matchers:
      - type: regex
        regex:
          - "(?i)(DB_PASSWORD|DATABASE_URL|SECRET_KEY|API_KEY|AWS_SECRET|MYSQL_PASSWORD|REDIS_URL)\\s*="
        condition: or
      - type: status
        status:
          - 200
    matchers-condition: and
