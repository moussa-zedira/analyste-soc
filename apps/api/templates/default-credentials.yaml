id: default-credentials
info:
  name: "Default Login Pages Detection"
  severity: high
  description: "Detection de pages de connexion par defaut pour des applications et services courants."
  tags: default-login,high,misconfig,credentials

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/admin/login"
      - "{{BaseURL}}/administrator"
      - "{{BaseURL}}/wp-login.php"
      - "{{BaseURL}}/user/login"
      - "{{BaseURL}}/phpmyadmin"
      - "{{BaseURL}}/manager/html"
      - "{{BaseURL}}/jenkins/login"
      - "{{BaseURL}}/grafana/login"
    matchers:
      - type: word
        words:
          - "login"
          - "password"
          - "username"
          - "Sign in"
          - "Log in"
        condition: or
      - type: status
        status:
          - 200
          - 302
    matchers-condition: and
    extractors:
      - name: login_page
        type: regex
        regex:
          - "<title>(.*?)</title>"
