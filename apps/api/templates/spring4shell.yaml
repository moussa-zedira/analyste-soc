id: spring4shell
info:
  name: "Spring4Shell RCE Detection (CVE-2022-22965)"
  severity: critical
  description: "Detection de la vulnerabilite Spring Framework RCE via class loader manipulation."
  tags: cve,cve2022,rce,spring,java,critical

http:
  - method: POST
    path:
      - "{{BaseURL}}"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body: "class.module.classLoader.resources.context.parent.pipeline.first.pattern=%25%7Bprefix%7Di"
    matchers:
      - type: status
        status:
          - 200
          - 500
      - type: word
        words:
          - "class.module.classLoader"
          - "springframework"
        condition: or
    matchers-condition: or

  - method: GET
    path:
      - "{{BaseURL}}/?class.module.classLoader.resources.context.parent.pipeline.first.pattern=test"
    matchers:
      - type: status
        status:
          - 200
          - 400
      - type: regex
        regex:
          - "(?i)spring|whitelabel error"
    matchers-condition: or
