# All secrets are loaded from .env (NOT committed to git).
# See .env.example for required variables.
# (Compose v2 n'utilise plus la cle `version`.)

services:
  # ── Infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}"]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}

  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    security_opt:
      - no-new-privileges:true
    # Resource limits (V4.7 hardening) — evite OOM cascade.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.5
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENV: ${ENV:-dev}
      STEALTH_MODE: ${STEALTH_MODE:-false}
      ENABLE_OFFENSIVE: ${ENABLE_OFFENSIVE:-true}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_KEY: ${API_KEY:?API_KEY required in .env}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
      ML_MODELS_DIR: /data/models
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TRIAGE_ENABLED: ${TRIAGE_ENABLED:-true}
      MIN_SEVERITY: ${MIN_SEVERITY:-medium}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cyberdef-api}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      # Phishing module (optional — leave empty for preview mode)
      PHISHING_SMTP_HOST: ${PHISHING_SMTP_HOST:-}
      PHISHING_SMTP_PORT: ${PHISHING_SMTP_PORT:-587}
      PHISHING_SMTP_USER: ${PHISHING_SMTP_USER:-}
      PHISHING_SMTP_PASS: ${PHISHING_SMTP_PASS:-}
      PHISHING_SMTP_TLS: ${PHISHING_SMTP_TLS:-true}
      PHISHING_CALLBACK_SERVER: ${PHISHING_CALLBACK_SERVER:-http://localhost:8000}
      # SOAR connectors (tous optionnels — fallback log-only si vides)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      FALCON_CLIENT_ID: ${FALCON_CLIENT_ID:-}
      FALCON_CLIENT_SECRET: ${FALCON_CLIENT_SECRET:-}
      FALCON_BASE_URL: ${FALCON_BASE_URL:-}
      PANORAMA_HOST: ${PANORAMA_HOST:-}
      PANORAMA_API_KEY: ${PANORAMA_API_KEY:-}
      # GoPhish integration (optional — preview-only if not set)
      GOPHISH_API_URL: ${GOPHISH_API_URL:-}
      GOPHISH_API_KEY: ${GOPHISH_API_KEY:-}
      # Pentest safety — whitelist CIDR (comma-separated, ex. "10.0.0.0/8,192.168.0.0/16")
      PENTEST_ALLOWED_TARGETS: ${PENTEST_ALLOWED_TARGETS:-}
      # Red Team — Sliver C2 (V4.3a) + audit signing (V4.3b)
      SLIVER_OPERATOR_CFG: ${SLIVER_OPERATOR_CFG:-}
      SLIVER_DEFAULT_C2_URL: ${SLIVER_DEFAULT_C2_URL:-}
      SLIVER_BUILD_OUTPUT_DIR: ${SLIVER_BUILD_OUTPUT_DIR:-/data/sliver/builds}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
    volumes:
      - geoip_data:/data/geoip
      - ml_models:/data/models
      - rag_data:/data/rag
      - sliver_configs:/data/sliver/configs
      - sliver_builds:/data/sliver/builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery Worker ───────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    command: celery -A apps.api.celery_app worker --loglevel=info --concurrency=2
    environment:
      ENV: ${ENV:-dev}
      STEALTH_MODE: ${STEALTH_MODE:-false}
      ENABLE_OFFENSIVE: ${ENABLE_OFFENSIVE:-true}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_KEY: ${API_KEY:?API_KEY required in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required in .env}
      GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
      ML_MODELS_DIR: /data/models
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cyberdef-api}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      # SOAR connectors (worker execute les playbooks via Celery)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      FALCON_CLIENT_ID: ${FALCON_CLIENT_ID:-}
      FALCON_CLIENT_SECRET: ${FALCON_CLIENT_SECRET:-}
      FALCON_BASE_URL: ${FALCON_BASE_URL:-}
      PANORAMA_HOST: ${PANORAMA_HOST:-}
      PANORAMA_API_KEY: ${PANORAMA_API_KEY:-}
      # GoPhish integration (optional — preview-only if not set)
      GOPHISH_API_URL: ${GOPHISH_API_URL:-}
      GOPHISH_API_KEY: ${GOPHISH_API_KEY:-}
      # Pentest safety — whitelist CIDR (comma-separated, ex. "10.0.0.0/8,192.168.0.0/16")
      PENTEST_ALLOWED_TARGETS: ${PENTEST_ALLOWED_TARGETS:-}
      # Red Team — Sliver C2 (V4.3a) + audit signing (V4.3b)
      SLIVER_OPERATOR_CFG: ${SLIVER_OPERATOR_CFG:-}
      SLIVER_DEFAULT_C2_URL: ${SLIVER_DEFAULT_C2_URL:-}
      SLIVER_BUILD_OUTPUT_DIR: ${SLIVER_BUILD_OUTPUT_DIR:-/data/sliver/builds}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
    volumes:
      - geoip_data:/data/geoip
      - ml_models:/data/models
      - rag_data:/data/rag
      - sliver_configs:/data/sliver/configs
      - sliver_builds:/data/sliver/builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat ─────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    command: celery -A apps.api.celery_app beat --loglevel=info
    environment:
      ENV: ${ENV:-dev}
      STEALTH_MODE: ${STEALTH_MODE:-false}
      ENABLE_OFFENSIVE: ${ENABLE_OFFENSIVE:-true}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_KEY: ${API_KEY:?API_KEY required in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required in .env}
      GEOIP_DB_PATH: /data/geoip/GeoLite2-City.mmdb
      ML_MODELS_DIR: /data/models
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    volumes:
      - geoip_data:/data/geoip
      - ml_models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Syslog Receiver ────────────────────────────────────
  syslog:
    build:
      context: .
      dockerfile: apps/collectors/Dockerfile
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:1514:1514"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:?API_KEY required in .env}
      SYSLOG_UDP_PORT: "514"
      SYSLOG_TCP_PORT: "1514"
      BATCH_SIZE: "50"
      FLUSH_INTERVAL: "2"
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────
  # API key is NOT exposed to the browser. The frontend uses a server-side
  # proxy route (apps/web/src/app/api/proxy/[...path]/route.ts) that injects
  # the API key from the server-only INTERNAL_API_KEY env var.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
      INTERNAL_API_BASE_URL: http://api:8000
      INTERNAL_API_KEY: ${API_KEY:?API_KEY required in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  # ── Agent ───────────────────────────────────────────────
  # Simulateur desactive. Pour reactiver:
  # docker compose up agent -d
  # agent:
  #   build:
  #     context: .
  #     dockerfile: apps/agent/Dockerfile
  #   environment:
  #     API_BASE_URL: http://api:8000
  #     API_KEY: ${API_KEY}
  #   depends_on:
  #     api:
  #       condition: service_healthy

  # ── Sliver C2 server (V4.3a) — opt-in profile "redteam" ──
  # Activation: `docker compose --profile redteam up -d sliver`
  # Apres premier demarrage, generer un fichier .cfg operator a copier
  # dans le container api, puis exporter SLIVER_OPERATOR_CFG dans .env.
  sliver:
    image: ghcr.io/bishopfox/sliver-server:latest
    security_opt:
      - no-new-privileges:true
    profiles: ["redteam"]
    ports:
      - "127.0.0.1:31337:31337"
    volumes:
      - sliver_data:/home/sliver/.sliver
      - sliver_configs:/data/sliver/configs
      - sliver_builds:/data/sliver/builds
    restart: unless-stopped

volumes:
  pgdata:
  geoip_data:
  ml_models:
  rag_data:
  sliver_data:
  sliver_configs:
  sliver_builds:
